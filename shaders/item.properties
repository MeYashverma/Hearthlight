# Hearthlight - item material IDs
#
# Iris gives the held item a light level automatically for block items (it asks
# the block for its emission), but it always reports a white light colour. This
# map lets the pack look up a colour for the light in the hand; the IDs match
# the block IDs in block.properties so both share one colour table.
#
# Only block items can produce a held light, so only those appear here.

