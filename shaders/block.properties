# Hearthlight - block material IDs
#
# Only two ranges are used:
#   10032 - 10079  emitters, also the index into the colour table in
#                  include/light_colors.glsl (index = ID - 10032)
#   10080 - 10095  blocks that light passes through, skipped by voxelization
#
# Everything else (1 - 31) is a plain opaque block. Blocks that are not listed
# here are treated as opaque as well, which is the safe default.

# -----------------------------------------------------------------------------
# Emitters
# -----------------------------------------------------------------------------
block.10032 = minecraft:sea_lantern
block.10033 = minecraft:end_rod
block.10034 = minecraft:glow_lichen minecraft:firefly_bush
block.10035 = minecraft:glowstone minecraft:lantern minecraft:redstone_lamp:lit=true
block.10036 = minecraft:torch minecraft:wall_torch minecraft:campfire:lit=true \
              minecraft:furnace:lit=true minecraft:blast_furnace:lit=true \
              minecraft:smoker:lit=true
block.10037 = minecraft:cave_vines minecraft:cave_vines_plant
block.10038 = minecraft:jack_o_lantern
block.10039 = minecraft:lava minecraft:magma_block
block.10040 = minecraft:fire minecraft:shroomlight
block.10041 = minecraft:brewing_stand minecraft:enchanting_table
block.10042 = minecraft:beacon
block.10043 = minecraft:sculk_sensor minecraft:calibrated_sculk_sensor
block.10044 = minecraft:sculk minecraft:sculk_catalyst minecraft:sculk_shrieker \
              minecraft:sculk_vein
block.10045 = minecraft:spawner minecraft:crying_obsidian
block.10046 = minecraft:sea_pickle
block.10047 = minecraft:candle:lit=true minecraft:white_candle:lit=true \
              minecraft:orange_candle:lit=true minecraft:magenta_candle:lit=true \
              minecraft:light_blue_candle:lit=true minecraft:yellow_candle:lit=true \
              minecraft:lime_candle:lit=true minecraft:pink_candle:lit=true \
              minecraft:gray_candle:lit=true minecraft:light_gray_candle:lit=true \
              minecraft:cyan_candle:lit=true minecraft:purple_candle:lit=true \
              minecraft:blue_candle:lit=true minecraft:brown_candle:lit=true \
              minecraft:green_candle:lit=true minecraft:red_candle:lit=true \
              minecraft:black_candle:lit=true minecraft:candle_cake:lit=true
block.10048 = minecraft:ochre_froglight
block.10049 = minecraft:verdant_froglight
block.10050 = minecraft:pearlescent_froglight
block.10051 = minecraft:amethyst_cluster
block.10052 = minecraft:soul_fire minecraft:soul_torch minecraft:soul_wall_torch \
              minecraft:soul_lantern
block.10053 = minecraft:end_portal minecraft:end_gateway
block.10054 = minecraft:nether_portal
block.10055 = minecraft:copper_torch minecraft:copper_wall_torch \
              minecraft:copper_lantern
block.10056 = minecraft:copper_bulb:lit=true
block.10057 = minecraft:open_eyeblossom
block.10058 = minecraft:light

# -----------------------------------------------------------------------------
# Blocks that light passes through. Water, glass and foliage are the ones that
# matter: without these entries the voxel volume would treat a leaf canopy or a
# window as a solid wall and coloured light would stop at it.
# -----------------------------------------------------------------------------
block.10080 = minecraft:water minecraft:bubble_column minecraft:powder_snow \
              minecraft:glass minecraft:tinted_glass minecraft:glass_pane \
              minecraft:ice minecraft:blue_ice minecraft:frosted_ice \
              minecraft:cobweb minecraft:slime_block minecraft:honey_block

# All leaf types, including the pale oak from 1.21.4 and anything a mod adds to
# the vanilla tag.
block.10081 = %minecraft:leaves

# Plants and other non-solid decoration. These are cutout geometry, so without
# an entry here every tuft of grass would block coloured light.
block.10082 = %minecraft:replaceable %minecraft:saplings %minecraft:tall_flowers \
              minecraft:short_grass minecraft:tall_grass minecraft:fern \
              minecraft:large_fern minecraft:dead_bush minecraft:vine \
              minecraft:big_dripleaf minecraft:small_dripleaf \
              minecraft:hanging_roots minecraft:nether_sprouts \
              minecraft:crimson_roots minecraft:warped_roots \
              minecraft:lily_pad minecraft:sugar_cane minecraft:kelp \
              minecraft:kelp_plant minecraft:seagrass minecraft:tall_seagrass
