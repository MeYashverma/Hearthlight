# Hearthlight - block material IDs
#
# Only two ranges are used:
#   10032 - 10079  emitters, also the index into the colour table in
#                  include/light_colors.glsl (index = ID - 10032)
#   10080 - 10095  blocks that light passes through, skipped by voxelization
#
# Everything else (1 - 31) is a plain opaque block. Blocks that are not listed
# here are treated as opaque as well, which is the safe default.

# -----------------------------------------------------------------------------
# Specular materials. These are opaque to the light volume (IDs 1..31), they
# only tell the shader how glossy a surface is. See get_material_specular().
# -----------------------------------------------------------------------------
# 10001 - metal blocks: sharp, bright highlight
block.10001 = minecraft:iron_block minecraft:gold_block minecraft:copper_block \
              minecraft:netherite_block minecraft:diamond_block \
              minecraft:emerald_block minecraft:lapis_block \
              minecraft:exposed_copper minecraft:weathered_copper \
              minecraft:oxidized_copper minecraft:cut_copper \
              minecraft:exposed_cut_copper minecraft:weathered_cut_copper \
              minecraft:oxidized_cut_copper minecraft:raw_iron_block \
              minecraft:raw_gold_block minecraft:raw_copper_block \
              minecraft:iron_bars minecraft:chain minecraft:anvil \
              minecraft:chipped_anvil minecraft:damaged_anvil minecraft:lodestone

# 10002 - polished stone, quartz, amethyst, copper bulbs: glossy but diffuse
block.10002 = minecraft:quartz_block minecraft:quartz_pillar minecraft:quartz_bricks \
              minecraft:smooth_quartz minecraft:chiseled_quartz_block \
              minecraft:amethyst_block minecraft:polished_andesite \
              minecraft:polished_diorite minecraft:polished_granite \
              minecraft:polished_deepslate minecraft:polished_blackstone \
              minecraft:polished_basalt minecraft:polished_tuff \
              minecraft:smooth_stone minecraft:smooth_basalt minecraft:bone_block \
              minecraft:calcite minecraft:dripstone_block \
              minecraft:cherry_planks minecraft:stripped_oak_log \
              minecraft:stripped_birch_log minecraft:stripped_spruce_log

# 10003 - snow and packed ice: bright, tight highlight. Plain ice, blue ice and
# powder snow are deliberately *not* here: they are in the light-transparent
# range below, and a block can only have one ID.
block.10003 = minecraft:packed_ice minecraft:snow_block minecraft:snow

# 10004 - copper grates and doors: warmer, rougher metal. Copper blocks
# themselves are already in 10001, and the lit copper bulb stays an emitter.
block.10004 = minecraft:copper_grate minecraft:exposed_copper_grate \
              minecraft:weathered_copper_grate minecraft:oxidized_copper_grate \
              minecraft:copper_door minecraft:copper_trapdoor \
              minecraft:copper_bars

