# Hearthlight
#
# Iris shader pack properties. The quality values themselves live as consts in
# include/settings.glsl; this file declares the images the coloured light volume
# needs and a few rendering directives.

# Coloured block light is built from custom images and a compute shader, so the
# pack is useless without them.
iris.features.required = CUSTOM_IMAGES COMPUTE_SHADERS

# The light block (/setblock light) is invisible in vanilla but emits light.
# Rendering it as a tiny quad lets the coloured light volume pick it up.
voxelizeLightBlocks = true

# Vanilla overlays are rendered by the pack instead of on top of it.
underwaterOverlay = false
vignette = false

# Rain writes to the depth buffer by default, which makes it keep the rain out
# of the shadow map but also produces z-fighting with translucent geometry.
rain.depth = false

# -----------------------------------------------------------------------------
# Custom images. The syntax is:
#   image.<name> = <sampler> <pixel format> <internal format> <pixel type> <clear> <relative> [size]
#
# voxel_img has to be cleared every frame, otherwise blocks that were removed
# would keep blocking light. The two light images must *not* be cleared: they
# carry the propagation state from one frame to the next.
# -----------------------------------------------------------------------------
image.voxel_img = voxel_sampler red_integer r8ui unsigned_byte true false 64 64 64
image.light_img_a = light_sampler_a rgba rgba16f half_float false false 64 64 64
image.light_img_b = light_sampler_b rgba rgba16f half_float false false 64 64 64
