# ---------------------------------------------------------------------------
# Hearthlight - dynamic sun/moon shadows + voxel ray-traced local lights for Iris (Minecraft Java 26.2)
# ---------------------------------------------------------------------------
iris.features.required = CUSTOM_IMAGES COMPUTE_SHADERS SSBO BLOCK_EMISSION_ATTRIBUTE

# One shadow pass does two jobs: a real sun/moon shadow map (terrain, translucents, entities,
# players, block entities) and, via its geometry stage, voxelization of the world into the light volume.
shadow.enabled = true
shadow.culling = false
shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowPlayer = true
shadowBlockEntities = true
shadowLightBlockEntities = false

# Light + occupancy volumes (128^3 blocks), rebuilt every frame by the shadow pass.
image.voxelMask = voxelMaskSampler red_integer r32ui unsigned_int true false 128 128 128
image.voxelLight = voxelLightSampler rgba rgba8 unsigned_byte true false 128 128 128

# Light list + per-cell bins (606,224 bytes used).
bufferObject.0 = 1000000

# ---- settings menu ---------------------------------------------------------
sliders = SUN_STRENGTH MOON_STRENGTH AMBIENT_DAY SUN_SHADOW_QUALITY SUN_SHADOW_SOFTNESS LIGHT_SS_SHADOWS LIGHT_SS_COUNT LIGHT_SS_STEPS LIGHT_INTENSITY LIGHT_RANGE COLOR_STRENGTH VANILLA_FILL DAY_SUPPRESS SHADOW_SOFTNESS SHADOW_RAY_STEPS MAX_LIGHTS_PER_PIXEL shadowMapResolution shadowDistance sunPathRotation
screen = <profile> <empty> [SUN] [LIGHTS] [LIGHT_SHADOWS] [PERFORMANCE] <empty> DEBUG_VIEW
screen.SUN = SUN_STRENGTH MOON_STRENGTH AMBIENT_DAY sunPathRotation SUN_SHADOW_SOFTNESS
screen.LIGHTS = LIGHT_INTENSITY LIGHT_RANGE COLOR_STRENGTH VANILLA_FILL DAY_SUPPRESS SHADOW_SOFTNESS
screen.LIGHT_SHADOWS = LIGHT_SS_SHADOWS LIGHT_SS_COUNT LIGHT_SS_STEPS
screen.PERFORMANCE = shadowMapResolution shadowDistance SUN_SHADOW_QUALITY MAX_LIGHTS_PER_PIXEL SHADOW_RAY_STEPS

profile.LOW = shadowMapResolution=1024 shadowDistance=64.0 SUN_SHADOW_QUALITY=1 MAX_LIGHTS_PER_PIXEL=2 SHADOW_RAY_STEPS=32 SHADOW_SOFTNESS=0.00
profile.MEDIUM = shadowMapResolution=2048 shadowDistance=96.0 SUN_SHADOW_QUALITY=2 MAX_LIGHTS_PER_PIXEL=4 SHADOW_RAY_STEPS=64 SHADOW_SOFTNESS=0.50
profile.HIGH = shadowMapResolution=3072 shadowDistance=128.0 SUN_SHADOW_QUALITY=3 MAX_LIGHTS_PER_PIXEL=6 SHADOW_RAY_STEPS=64 SHADOW_SOFTNESS=0.75
profile.ULTRA = shadowMapResolution=4096 shadowDistance=160.0 SUN_SHADOW_QUALITY=3 MAX_LIGHTS_PER_PIXEL=8 SHADOW_RAY_STEPS=96 SHADOW_SOFTNESS=1.00
