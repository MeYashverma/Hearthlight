# ---------------------------------------------------------------------------
# Hearthlight - voxel ray-traced local lighting for Iris (Minecraft Java 26.2)
# ---------------------------------------------------------------------------
iris.features.required = CUSTOM_IMAGES COMPUTE_SHADERS SSBO BLOCK_EMISSION_ATTRIBUTE

# The shadow pass is used purely as a voxelizer: no sun shadow map is produced.
shadow.enabled = true
shadow.culling = false
shadowTerrain = true
shadowTranslucent = false
shadowEntities = false
shadowPlayer = false
shadowBlockEntities = false
shadowLightBlockEntities = false

# Light + occupancy volumes (128^3), rebuilt every frame by the shadow pass.
image.voxelOcc = voxelOccSampler red r8 unsigned_byte true false 128 128 128
image.voxelLight = voxelLightSampler rgba rgba8 unsigned_byte true false 128 128 128

# Light list + per-cell bins (606,224 bytes used).
bufferObject.0 = 1000000

# ---- settings menu ---------------------------------------------------------
sliders = LIGHT_INTENSITY LIGHT_RANGE COLOR_STRENGTH VANILLA_FILL DAY_SUPPRESS SHADOW_SOFTNESS SHADOW_RAY_STEPS MAX_LIGHTS_PER_PIXEL SUN_SHADOWS SUN_SHADOW_STRENGTH SUN_SHADOW_STEPS SS_SHADOWS SS_SHADOW_STEPS SUN_SPECULAR
screen = <profile> <empty> [LIGHTING] [SHADOWS] [MATERIALS] [PERFORMANCE] <empty> DEBUG_VIEW
screen.LIGHTING = LIGHT_INTENSITY LIGHT_RANGE COLOR_STRENGTH VANILLA_FILL DAY_SUPPRESS
screen.SHADOWS = SUN_SHADOWS SUN_SHADOW_STRENGTH SUN_SHADOW_STEPS SS_SHADOWS SS_SHADOW_STEPS SHADOW_SOFTNESS
screen.MATERIALS = SUN_SPECULAR
screen.PERFORMANCE = MAX_LIGHTS_PER_PIXEL SHADOW_RAY_STEPS

profile.LOW = MAX_LIGHTS_PER_PIXEL=2 SHADOW_RAY_STEPS=24 SHADOW_SOFTNESS=0.00 SUN_SHADOWS=0 SS_SHADOWS=0 SUN_SHADOW_STEPS=16 SUN_SPECULAR=0.00
profile.MEDIUM = MAX_LIGHTS_PER_PIXEL=4 SHADOW_RAY_STEPS=36 SHADOW_SOFTNESS=0.50 SUN_SHADOWS=1 SUN_SHADOW_STEPS=24 SUN_SPECULAR=0.40
profile.HIGH = MAX_LIGHTS_PER_PIXEL=6 SHADOW_RAY_STEPS=48 SHADOW_SOFTNESS=0.75 SUN_SHADOWS=1 SUN_SHADOW_STEPS=32 SUN_SPECULAR=0.60
profile.ULTRA = MAX_LIGHTS_PER_PIXEL=8 SHADOW_RAY_STEPS=64 SHADOW_SOFTNESS=1.00 SUN_SHADOWS=1 SUN_SHADOW_STEPS=48 SUN_SPECULAR=1.00
